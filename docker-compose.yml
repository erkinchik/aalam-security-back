# Local-dev compose. Values are interpolated from `.env` in this directory
# (see .env.example). Secrets are NEVER hardcoded here; for prod use
# docker-compose.prod.yml + a separate .env on the VPS.
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-alarm_sos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ВАЖНО: ровно один экземпляр. Socket.IO работает без redis-адаптера, поэтому
  # комнаты, fetchSockets и socketsJoin действуют только внутри своего процесса:
  # вторая реплика не получит рассылку вызовов, а cron решит, что операторы
  # соседнего узла мертвы, и снимет их со смены. Throttler тоже держит счётчики
  # в памяти. Перед масштабированием — @socket.io/redis-adapter и Redis-хранилище
  # throttler'а (см. TASKS.md, B2 и п. 15).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.8'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
