services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alarm_sos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'     # Выделяем базе максимум 1 ядро
          memory: 2G      # И не более 2 ГБ оперативной памяти
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Ограничиваем размер одного файла логов до 10 МБ
        max-file: "3"     # Храним не более 3 таких файлов (старые удаляются)

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'     # Redis очень легкий, ему хватит половины ядра
          memory: 256M    # И 256 МБ памяти
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.8'     # Не даем API забирать больше 80% ядра
          memory: 1G      # Не более 1 ГБ памяти
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alarm_sos?connection_limit=5&pool_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: super-secret-access-change-me
      JWT_REFRESH_SECRET: super-secret-refresh-change-me
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: